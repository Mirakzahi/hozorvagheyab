<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سیستم حضور و غیاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-3">سیستم حضور و غیاب</h1>

    <div class="card mb-3">
      <div class="card-body">
        <form id="attendanceForm">
          <div class="mb-2">
            <label>کد پرسنلی</label>
            <input id="code" class="form-control" required />
          </div>
          <div class="mb-2">
            <label>نوع</label>
            <select id="type" class="form-select">
              <option value="IN">ورود</option>
              <option value="OUT">خروج</option>
            </select>
          </div>
          <div class="mb-2">
            <label>یادداشت (اختیاری)</label>
            <input id="note" class="form-control" />
          </div>
          <button class="btn btn-primary" type="submit">ثبت</button>
          <span id="msg" class="ms-2"></span>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5>گزارش اخیر</h5>
        <div id="recent"></div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
